<!DOCTYPE html>
<html>
<head>
  <title>IoT Monitoring</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI';
      background: #0a101d;
      color: white;
      padding: 20px;
    }

    .card {
      background: #1f2a3b;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .flex {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .relay-box {
      background: #111827;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      flex: 1;
      min-width: 120px;
    }

    button {
      padding: 8px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin: 3px;
      width: 70px;
    }

    .btn-connect { background: #22c55e; }
    .btn-disconnect { background: #ef4444; }

    .btn-manual { background: #3b82f6; }
    .btn-auto { background: #8b5cf6; }

    .relay-on { background: #22c55e; }
    .relay-off { background: #ef4444; }

    .bar {
      height: 10px;
      background: #334155;
      border-radius: 10px;
      margin-top: 10px;
    }

    .fill {
      height: 100%;
      border-radius: 10px;
    }

    canvas {
      max-height: 180px;
    }

    @media (max-width: 768px) {
      .flex {
        flex-direction: column;
      }

      canvas {
        max-height: 250px;
      }
    }
  </style>
</head>

<body>

<div class="flex">

  <div class="card" style="flex:2">
    <h2>IoT Monitoring</h2>
    <div class="flex">
      <span id="status">Terputus</span>
      <button class="btn-connect" onclick="connect()">Hubungkan</button>
      <button class="btn-disconnect" onclick="disconnect()">Putus</button>
    </div>
  </div>

  <div class="card" style="flex:1">
    <h3>LDR</h3>
    <h2 id="ldr">-</h2>
  </div>

</div>

<div class="flex">
  <div class="card" style="flex:1">
    <h3>Suhu: <span id="suhu">--</span> °C</h3>
    <div class="bar">
      <div id="barSuhu" class="fill"></div>
    </div>
  </div>

  <div class="card" style="flex:1">
    <h3>Kelembapan: <span id="hum">--</span> %</h3>
    <div class="bar">
      <div id="barHum" class="fill" style="background:#3b82f6;"></div>
    </div>
  </div>
</div>

<div class="flex">

  <div class="card" style="flex:1">
    <h3>Mode</h3>
    <div class="flex">
      <button class="btn-manual" onclick="setMode('manual')">Manual</button>
      <button class="btn-auto" onclick="setMode('auto')">Otomatis</button>
    </div>
  </div>

  <div class="card" style="flex:2">
    <h3>Kontrol Relay</h3>

    <div class="flex">

      <div class="relay-box">
        <h4>Relay 1</h4>
        <button class="relay-on" onclick="setRelay(1, true)">ON</button>
        <button class="relay-off" onclick="setRelay(1, false)">OFF</button>
      </div>

      <div class="relay-box">
        <h4>Relay 2</h4>
        <button class="relay-on" onclick="setRelay(2, true)">ON</button>
        <button class="relay-off" onclick="setRelay(2, false)">OFF</button>
      </div>

      <div class="relay-box">
        <h4>Relay 3</h4>
        <button class="relay-on" onclick="setRelay(3, true)">ON</button>
        <button class="relay-off" onclick="setRelay(3, false)">OFF</button>
      </div>

      <div class="relay-box">
        <h4>Relay 4</h4>
        <button class="relay-on" onclick="setRelay(4, true)">ON</button>
        <button class="relay-off" onclick="setRelay(4, false)">OFF</button>
      </div>

    </div>
  </div>

</div>

<div class="card">
  <h3>Grafik</h3>
  <canvas id="chart"></canvas>
</div>

<script>
let client;
let mode = "manual";

const ctx = document.getElementById('chart');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu', data: [] },
      { label: 'Kelembapan', data: [] }
    ]
  }
});

function connect() {
  client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  client.on("connect", () => {
    document.getElementById("status").innerText = "Terhubung";

    client.subscribe("smk/iot/suhu6");
    client.subscribe("smk/iot/kelembapan6");
    client.subscribe("smk/iot/ldr6");
  });

  client.on("message", (topic, message) => {
    let msg = message.toString();

    if (topic.includes("suhu")) {
      document.getElementById("suhu").innerText = msg;

      let warna = "green";
      if (msg > 30) warna = "red";
      else if (msg > 25) warna = "yellow";

      let bar = document.getElementById("barSuhu");
      bar.style.width = msg + "%";
      bar.style.background = warna;

      updateChart(msg, null);
    }

    if (topic.includes("kelembapan")) {
      document.getElementById("hum").innerText = msg;
      document.getElementById("barHum").style.width = msg + "%";
      updateChart(null, msg);
    }

    if (topic.includes("ldr")) {
      let el = document.getElementById("ldr");

      if (msg == "1") {
        el.innerText = "Terang";
        el.style.color = "yellow";
      } else {
        el.innerText = "Gelap";
        el.style.color = "cyan";
      }
    }
  });
}

function disconnect() {
  client.end();
  document.getElementById("status").innerText = "Terputus";
}

function setMode(m) {
  mode = m;
  client.publish("smk/iot/mode6", m);
}

function setRelay(n, state) {
  if (mode !== "manual") {
    alert("Mode harus Manual!");
    return;
  }

  let msg = `relay${n}_${state ? "on" : "off"}`;
  client.publish("smk/iot/control6", msg);
}

function updateChart(s, h) {
  let time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(s);
  chart.data.datasets[1].data.push(h);

  if (chart.data.labels.length > 50) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }

  chart.update();
}
</script>

</body>
</html>
