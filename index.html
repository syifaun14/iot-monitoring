<!DOCTYPE html>
<html>
<head>
  <title>IoT Monitoring</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI';
      background: #0a101d;
      color: white;
      padding: 20px;
    }

    .card {
      background: #1f2a3b;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

 .flex {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}
button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

    .btn-connect { background: #22c55e; }
    .btn-disconnect { background: #ef4444; }

    .btn-manual { background: #3b82f6; }
    .btn-auto { background: #8b5cf6; }

    .relay-on { background: #22c55e; }
    .relay-off { background: #ef4444; }

    .status-inline {
      margin-left: 10px;
      font-weight: bold;
    }

    .bar {
      height: 10px;
      background: #334155;
      border-radius: 10px;
      margin-top: 10px;
    }

    .fill {
      height: 100%;
      border-radius: 10px;
    }

    canvas {
      max-height: 180px;
    }
    @media (max-width: 768px) {
  .flex {
    flex-direction: column;
  }

  button {
  min-width: 100px;
}

  .card {
    width: 100%;
  }

  canvas {
    max-height: 250px;
  }
}
  </style>
</head>

<body>

<div class="flex">

  <!-- CARD KIRI -->
  <div class="card" style="flex:2">
    <h2>IoT Monitoring</h2>

    <div class="flex">
      <span id="status" class="status-inline">Terputus</span>
      <button class="btn-connect" onclick="connect()">Hubungkan</button>
      <button class="btn-disconnect" onclick="disconnect()">Putus</button>
    </div>
  </div>

  <!-- CARD KANAN (LDR) -->
  <div class="card" style="flex:1">
    <h3>LDR</h3>
    <h2 id="ldr">-</h2>
  </div>

</div>

<div class="flex">
  <div class="card" style="flex:1">
    <h3>Suhu: <span id="suhu">--</span> °C</h3>
    <div class="bar">
      <div id="barSuhu" class="fill"></div>
    </div>
  </div>

  <div class="card" style="flex:1">
    <h3>Kelembapan: <span id="hum">--</span> %</h3>
    <div class="bar">
      <div id="barHum" class="fill" style="background:#3b82f6;"></div>
    </div>
  </div>
</div>

<div class="flex">
  <div class="card" style="flex:1">
    <h3>Mode: <span id="modeText">-</span></h3>
    <div class="flex">
      <button class="btn-manual" onclick="setMode('manual')">Manual</button>
      <button class="btn-auto" onclick="setMode('auto')">Otomatis</button>
    </div>
  </div>

  <div class="card" style="flex:2">
    <h3>Kontrol Relay</h3>
    <div class="flex">
      <button id="r1" class="relay-off" onclick="toggleRelay(1)">OFF</button>
      <button id="r2" class="relay-off" onclick="toggleRelay(2)">OFF</button>
      <button id="r3" class="relay-off" onclick="toggleRelay(3)">OFF</button>
      <button id="r4" class="relay-off" onclick="toggleRelay(4)">OFF</button>
    </div>
  </div>
</div>

<div class="card">
  <h3>Grafik</h3>
  <canvas id="chart"></canvas>
</div>

<script>
let client;
let mode = "manual";
let relayState = [false, false, false, false];

const ctx = document.getElementById('chart');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      {
        label: 'Suhu (°C)',
        data: [],
        borderWidth: 2,
        tension: 0.4,
        pointRadius: 2
      },
      {
        label: 'Kelembapan (%)',
        data: [],
        borderWidth: 2,
        tension: 0.4,
        pointRadius: 2,
        borderColor: '#3b82f6'
      }
    ]
  },
  options: {
    responsive: true,
    animation: false,
    plugins: {
      legend: {
        labels: {
          color: 'white'
        }
      }
    },
    scales: {
      x: {
        ticks: { color: 'white', maxTicksLimit: 8 },
        grid: { color: '#334155' }
      },
      y: {
        ticks: { color: 'white' },
        grid: { color: '#334155' }
      }
    }
  }
});

function connect() {
  client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  client.on("connect", () => {
    document.getElementById("status").innerText = "Terhubung";

    client.subscribe("smk/iot/suhu6");
    client.subscribe("smk/iot/kelembapan6");
  });

  client.on("message", (topic, message) => {
    let msg = message.toString();

    if (topic.includes("suhu")) {
      document.getElementById("suhu").innerText = msg;

      let warna = "green";
      if (msg > 30) warna = "red";
      else if (msg > 25) warna = "yellow";

      let bar = document.getElementById("barSuhu");
      bar.style.width = msg + "%";
      bar.style.background = warna;

      updateChart(msg, null);

      document.getElementById("ldr").innerText =
        msg > 28 ? "Terang" : "Gelap";
    }

    if (topic.includes("kelembapan")) {
      document.getElementById("hum").innerText = msg;
      document.getElementById("barHum").style.width = msg + "%";
      updateChart(null, msg);
    }
  });
}

function disconnect() {
  client.end();
  document.getElementById("status").innerText = "Terputus";
}

function setMode(m) {
  mode = m;
  client.publish("smk/iot/mode6", m);
  document.getElementById("modeText").innerText =
    m === "manual" ? "Mode Manual" : "Mode Otomatis";
}

function toggleRelay(n) {
  if (mode !== "manual") {
    alert("Mode harus Manual!");
    return;
  }

  relayState[n-1] = !relayState[n-1];

  let msg = `relay${n}_${relayState[n-1] ? "on" : "off"}`;
  client.publish("smk/iot/control6", msg);

  let btn = document.getElementById("r" + n);
  btn.innerText = relayState[n-1] ? "ON" : "OFF";
  btn.className = relayState[n-1] ? "relay-on" : "relay-off";
}

function updateChart(s, h) {
  let time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);

  // ===== SUHU =====
  if (s !== null) {
    chart.data.datasets[0].data.push(parseFloat(s));

    // warna dinamis
    if (s > 30) chart.data.datasets[0].borderColor = "red";
    else if (s > 25) chart.data.datasets[0].borderColor = "yellow";
    else chart.data.datasets[0].borderColor = "lime";
  } else {
    chart.data.datasets[0].data.push(null);
  }

  // ===== KELEMBAPAN =====
  if (h !== null) {
    chart.data.datasets[1].data.push(parseFloat(h));
  } else {
    chart.data.datasets[1].data.push(null);
  }

  // ===== LIMIT DATA (lebih panjang) =====
  if (chart.data.labels.length > 50) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }

  chart.update();
}
</script>

</body>
</html>
